# Ledger-8 control for the multi-call gas repro (see ../README.md).
# Ports 39944/38088/36300, offset from the ledger-9 repro's 29944/28088/26300 so both lines can
# run side by side. LOCAL DEVELOPMENT ONLY. Tear down with: docker compose down -v
name: gas-repro-l8

services:
  node:
    image: midnightntwrk/midnight-node:1.0.0
    container_name: gas-repro-l8-node
    ports:
      - '39944:9944'
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
    # Healthy means "producing blocks", not just "HTTP up": indexer-standalone 4.3.x's SPO
    # component exits 1 if it connects while the chain is still at genesis.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf -H ''Content-Type: application/json'' -d ''{"id":1,"jsonrpc":"2.0","method":"chain_getBlockHash","params":[1]}'' http://localhost:9944 | grep -q ''"result":"0x''',
        ]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 20s

  indexer:
    # 4.3.3 is the last stable ledger-8 tag; 4.3.4/4.4.0 are ledger-9/node-2 integration builds.
    # Its SPO indexer hard-requires a Blockfrost id at boot -- a dummy satisfies the config loader.
    image: midnightntwrk/indexer-standalone:4.3.3
    container_name: gas-repro-l8-indexer
    restart: on-failure
    ports:
      - '38088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__NODE__URL: 'ws://node:9944'
      APP__INFRA__STORAGE__PASSWORD: 'indexer'
      APP__INFRA__PUB_SUB__PASSWORD: 'indexer'
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: 'indexer'
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
      APP__INFRA__SPO_NODE__URL: 'ws://node:9944'
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: 'local-devnet-dummy-id'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  proof-server:
    # 8.1.0 matches the ledger-v8 that midnight-js 4.1.1 pins client-side.
    image: midnightntwrk/proof-server:8.1.0
    container_name: gas-repro-l8-proof-server
    command: ['midnight-proof-server -v']
    ports:
      - '36300:6300'
    environment:
      RUST_BACKTRACE: 'full'
    healthcheck:
      test: ['CMD-SHELL', 'echo > /dev/tcp/127.0.0.1/6300']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
